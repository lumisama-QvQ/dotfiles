context.properties = {
    # 基础默认采样率
    default.clock.rate = 48000
    
    # 允许动态切换的采样率列表 (按需添加或删减，如 44100, 96000, 192000)
    default.clock.allowed-rates = [ 44100 48000 88200 96000 192000 ]
    # 取值范围 0-14（部分旧版本最高为 10）。数值越高音质越好，10 或 14 几乎是录音室级别的重采样，当前 CPU 性能完全带得动。
    resample.quality = 10
    # 降低默认处理块大小（默认可能为 1024）。256 或 512 是兼顾低延迟和日常稳定的甜点值。
    default.clock.quantum = 256
    default.clock.min-quantum = 128
    default.clock.max-quantum = 2048
    # 强制默认格式为 32 位浮点或 24/32 位整数
    default.clock.format = "S32LE"
}
